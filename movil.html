<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MISTVEIL · móvil</title>
<style>
  @font-face { font-family: 'Gelica'; font-style: normal; font-weight: 400;
    src: url('assets/fonts/Gelica-Regular.otf') format('opentype'); font-display: swap; }
  html, body { margin: 0; height: 100%; background: #07050e; overflow: hidden; overscroll-behavior: none; }
  body { display: grid; place-items: center; }
  canvas {
    image-rendering: auto;
    background: #141120;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  /* Aviso: el juego es apaisado */
  #rotate {
    position: fixed; inset: 0; display: none; place-items: center;
    background: #07050e; color: #cfc6e8; font: 22px Gelica, serif;
    text-align: center; z-index: 10;
  }
  @media (orientation: portrait) { #rotate { display: grid; } }
</style>
</head>
<body>
<canvas id="game" width="640" height="360"></canvas>
<div id="rotate">⟳<br>Gira el móvil<br><span style="color:#6c6193;font-size:14px">MISTVEIL se juega en horizontal</span></div>
<script>window.MISTVEIL_MOBILE = true;</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
