<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mistveil — test de humo</title>
<style>
  body { background: #14121d; color: #cfc6e8; font: 14px/1.6 monospace; padding: 24px; }

</style>

<body>
<h1>test_smoke</h1>
<div id="out"></div>
<script type="module">
// Test de humo: DataDB valida, el player existe y se mueve, el pool de lágrimas funciona.
import { DataDB } from '../js/data_db.js';
import { Player, Enemy, TearPool, BulletPool } from '../js/entities.js';
import { computeQuality, Cadencia } from '../js/cadencia.js';
import { buildTestFloor, buildTower, Room, isDoorFront, poolBioma, rescateElegible, TILE, RW, RH } from '../js/rooms.js';
import { applyItem, applyItemEffects } from '../js/items.js';
import { elementMult } from '../js/spells.js';
import { EventBus } from '../js/event_bus.js';
import { GameState, RunState, AudioManager, SaveManager } from '../js/state.js';
import { nodoDisponible, activarNodo, esferaBonos } from '../js/esfera.js';
import { syncFamiliares, updateFamiliares } from '../js/familiares.js';
import { spawnArt, updateArt, romano } from '../js/artes_fx.js';
import { selloDef, obtenerSello, rasgoCuraPorSp, finisherElemental, selloStatPasivo, selloSpPorPerfecto, selloArmaduraSala, selloRango } from '../js/sellos.js';
import { pickAzar, aplicarEvento } from '../js/eventos.js';
import { drawItemIcon } from '../js/item_icons.js';
import { Pactos, calcHeat, calcMemoriaMult, calcEfecto, nivelClamp } from '../js/pactos.js';
import { FX } from '../js/fx.js';
import { barrioVivo, distritos as ciudadDistritos, poblarVecinos, vecinos as ciudadVecinos } from '../js/ciudad.js';

const out = document.getElementById('out');
let failed = 0;
function assert(name, cond) {
  const li = document.createElement('div');
  li.className = cond ? 'pass' : 'fail';
  li.textContent = (cond ? 'PASS  ' : 'FAIL  ') + name;
  out.appendChild(li);
  if (!cond) failed++;
}

// Corrige las rutas relativas de DataDB (tests/ está un nivel por debajo)
const origFetch = window.fetch;
window.fetch = (url, ...a) => origFetch(url.startsWith('data/') ? '../' + url : url, ...a);

const ok = await DataDB.load();
assert('DataDB carga sin errores', ok && DataDB.errors.length === 0);
assert('balance.player.move_speed existe y es número', typeof DataDB.balance?.player?.move_speed === 'number');
assert('elementos define color para neutro', typeof DataDB.elementos?.neutro?.color === 'string');
assert('enemigos incluye cera_andante', !!DataDB.enemigo('cera_andante'));
assert('textos_es tiene ui.muerte', DataDB.texto('ui.muerte') !== '[ui.muerte]');

// A1 — Reloj de beat: datos de BPM y método beatClock() defensivo
assert('musica.json carga con BPM por pista', DataDB.musicaBpm('mus_pendulos')?.bpm > 0);
assert('musicaBpm devuelve null para pista sin medir', DataDB.musicaBpm('inexistente_xyz') === null);
assert('beatClock inactivo sin pista sonando', AudioManager.beatClock().active === false);
// Con una pista simulada (ctx + _musSrc + BPM), la fase avanza y el índice de beat crece
(() => {
  const A = AudioManager;
  const guardado = { ctx: A.ctx, src: A._musSrc, t0: A._musStartTime, bpm: A._musBpm, off: A._musBeatOffset };
  A.ctx = { currentTime: 0 }; A._musSrc = {}; A._musBpm = 120; A._musBeatOffset = 0; A._musStartTime = 0;
  const b0 = A.beatClock();            // t=0 → beat 0, fase 0
  A.ctx.currentTime = 0.5;             // 120 BPM → medio segundo = 1 beat exacto
  const b1 = A.beatClock();
  assert('beatClock activo con pista simulada', b0.active === true && b0.bpm === 120);
  assert('beatClock avanza el índice de beat', b1.beat === 1 && Math.abs(b1.phase) < 0.02);
  assert('beatClock pulse decae dentro del beat', b0.pulse === 1 && A.beatClock() && (A.ctx.currentTime = 0.75, A.beatClock().pulse < 0.6));
  A.ctx = guardado.ctx; A._musSrc = guardado.src; A._musStartTime = guardado.t0; A._musBpm = guardado.bpm; A._musBeatOffset = guardado.off;
})();

// A5 — Música reactiva: helpers puros (beatTime, reactiveGain) + grooveBell defensivo
assert('balance.musica_reactiva presente y activable', DataDB.balance.musica_reactiva?.activa !== undefined && Array.isArray(DataDB.balance.musica_reactiva?.notas));
(() => {
  const A = AudioManager;
  const g = { bpm: A._musBpm, t0: A._musStartTime, off: A._musBeatOffset };
  A._musBpm = 120; A._musStartTime = 0; A._musBeatOffset = 0;
  assert('beatTime(0) = offset del primer beat', Math.abs(A.beatTime(0) - 0) < 1e-9);
  assert('beatTime(3) = 3 beats a 120 BPM (1.5 s)', Math.abs(A.beatTime(3) - 1.5) < 1e-9);
  A._musBpm = g.bpm; A._musStartTime = g.t0; A._musBeatOffset = g.off;
  const cfg = { umbral_frac: 0.25, gain_max: 0.05 };
  assert('reactiveGain 0 bajo el umbral', A.reactiveGain(0.1, cfg) === 0 && A.reactiveGain(0.25, cfg) === 0);
  assert('reactiveGain sube monótona hasta gain_max', A.reactiveGain(0.6, cfg) > 0 && A.reactiveGain(0.6, cfg) < A.reactiveGain(1, cfg) && Math.abs(A.reactiveGain(1, cfg) - 0.05) < 1e-9);
  // grooveBell no debe lanzar ni crear voces sin ctx / con intensidad nula
  const gctx = A.ctx; A.ctx = null;
  let ok = true; try { A.grooveBell(0, 0.8, false, cfg); A.grooveBell(1, 0, true, cfg); } catch { ok = false; }
  A.ctx = gctx;
  assert('grooveBell tolerante sin ctx / intensidad 0', ok);
})();

// B6 — PWA: manifest válido con iconos y rutas RELATIVAS (sirve en subruta de Pages)
{
  const mr = await fetch('../manifest.json').then(r => r.ok ? r.json() : null).catch(() => null);
  assert('manifest.json existe y parsea', !!mr);
  assert('manifest: name + start_url relativo + display standalone', !!mr && !!mr.name && !!mr.start_url && !mr.start_url.startsWith('/') && mr.display === 'standalone');
  assert('manifest: iconos 192/512 + maskable', !!mr && Array.isArray(mr.icons) && mr.icons.some(i => i.sizes === '192x192') && mr.icons.some(i => i.sizes === '512x512') && mr.icons.some(i => /maskable/.test(i.purpose || '')));
  const icoOk = await fetch('../assets/icons/icon-192.png').then(r => r.ok).catch(() => false);
  assert('icono PWA 192 existe', icoOk === true);
}

// B1 — Guardar/reanudar run: roundtrip de SaveManager y determinismo de la torre
(() => {
  SaveManager.clearRun();
  assert('sin partida guardada al empezar', SaveManager.hasRun() === false && SaveManager.loadRun() === null);
  SaveManager.saveRun({ piso: 3, semilla: 12345, oro: 42, items: ['a', 'b'], cur: '1,2' });
  const l = SaveManager.loadRun();
  assert('loadRun recupera piso/semilla/items/sala', l?.piso === 3 && l?.semilla === 12345 && l.items.length === 2 && l.cur === '1,2');
  assert('hasRun true con partida', SaveManager.hasRun() === true);
  SaveManager.saveRun({ basura: 1 }); // sin piso numérico → se ignora, la anterior sigue
  assert('saveRun ignora snapshot inválido', SaveManager.loadRun()?.piso === 3);
  SaveManager.clearRun();
  assert('clearRun borra la partida', SaveManager.hasRun() === false);
})();
// La torre es determinista en TOPOLOGÍA y posiciones de roamers (base de la reconstrucción B1)
(() => {
  const a = buildTower(3, 777), b = buildTower(3, 777);
  const keysA = [...a.rooms.keys()].sort().join('|'), keysB = [...b.rooms.keys()].sort().join('|');
  assert('buildTower reproduce las mismas salas', keysA === keysB && keysA.length > 0);
  const typA = [...a.rooms.values()].map(r => r.gx + ',' + r.gy + ':' + r.type).sort().join('|');
  const typB = [...b.rooms.values()].map(r => r.gx + ',' + r.gy + ':' + r.type).sort().join('|');
  assert('buildTower reproduce los mismos tipos de sala', typA === typB);
  assert('buildTower reproduce la sala inicial (current)', (a.current.gx + ',' + a.current.gy) === (b.current.gx + ',' + b.current.gy));
  // NOTA B1: las posiciones/nº de roamers NO son deterministas (las plantillas de sala usan
  // Math.random y desincronizan el RNG sembrado al colocar roamers). Por eso restoreSnapshot
  // DESCARTA los roamers de galerías ya visitadas en vez de fiarse de reproducirlos exactos.
  const bossA = [...a.rooms.values()].find(r => r.type === 'jefe'), bossB = [...b.rooms.values()].find(r => r.type === 'jefe');
  assert('buildTower reproduce la sala del jefe', bossA && bossB && bossA.gx === bossB.gx && bossA.gy === bossB.gy);
})();

// Dificultad — modificador ÉLITE (minijefe): +vida, +tamaño, rasgo, y aguante (acorazado)
assert('balance.elite define rasgos y multiplicadores', Array.isArray(DataDB.balance.elite?.rasgos) && DataDB.balance.elite.hp_mult > 1);
(() => {
  const base = new Enemy('cera_andante', 0, 0);
  const acor = new Enemy('cera_andante', 0, 0, { elite: 'acorazado' });
  const vel = new Enemy('cera_andante', 0, 0, { elite: 'veloz' });
  const E = DataDB.balance.elite;
  assert('élite tiene más vida y es mayor', acor.health.max > base.health.max && acor.r > base.r);
  assert('élite acorazado encaja menos daño', acor.takeDamage(20, 100, 0) < base.takeDamage(20, 100, 0));
  assert('élite veloz se mueve más rápido', vel.def.velocidad > base.def.velocidad);
  assert('enemigo normal no es élite', base.elite === null);
})();

// Salas nuevas — EVENTOS de altar data-driven (data/eventos.json + js/eventos.js)
assert('eventos.json carga con al menos 3 eventos', Array.isArray(DataDB.eventos?.eventos) && DataDB.eventos.eventos.length >= 3);
assert('cada evento tiene id, glifo y color', DataDB.eventos.eventos.every(e => e.id && e.glifo && e.color));
(() => {
  // pickAzar respeta el peso: con r casi 0 sale el primero; con r casi 1, el último
  const lista = [{ peso: 70, k: 'a' }, { peso: 30, k: 'b' }];
  assert('pickAzar elige por peso (extremos)', pickAzar(lista, 0.01).k === 'a' && pickAzar(lista, 0.99).k === 'b');
  // aplicarEvento con api simulada: un evento con coste sp que no se puede pagar → ok:false
  let oro = 0, sp = 0; const efectos = [];
  const api = { oro: () => oro, sp: () => sp, corazones: () => 3, rnd: () => 0.5, addOro: n => oro += n, addSp: n => sp += n, quitarCorazon: () => {}, efecto: ef => efectos.push(ef.tipo) };
  const conCoste = { nombre: 'X', coste: { sp: 70 }, efectos: [{ tipo: 'dar_item', pool: 'jefe' }] };
  assert('evento rechaza si no puedes pagar (no aplica efectos)', aplicarEvento(conCoste, api).ok === false && efectos.length === 0);
  sp = 100;
  const r = aplicarEvento(conCoste, api);
  assert('evento cobra coste y aplica efecto al poder pagar', r.ok === true && sp === 30 && efectos.includes('dar_item'));
  // evento con azar aplica exactamente una salida
  const azarEv = { nombre: 'Y', azar: [{ peso: 1, tipo: 'oro', valor: 5 }] };
  const before = efectos.length; aplicarEvento(azarEv, api);
  assert('evento con azar aplica una salida', efectos.length === before + 1);
})();

// Salas-DESAFÍO: combate reforzado con reloj de BONUS (el tiempo NO bloquea la salida)
(() => {
  const rd = new Room(1, 1, 'desafio', 3);
  assert('sala desafío tiene reto con límite de tiempo', !!rd.reto && rd.reto.limite > 0 && rd.reto.activo === false);
  assert('sala desafío es de combate (no pre-limpia) con spawns', rd.cleared === false && rd.spawnPts.length > 0);
})();

// Fase D — D1: plantillas de sala POR BIOMA (obstáculos que casan con la mecánica de zona)
assert('D1: roster de plantillas ampliado (≥25)', DataDB.salas_piso1.plantillas.length >= 25);
assert('D1: todas las plantillas son 13×7 con símbolos legales', (() => {
  const LEG = new Set('.#POEe$');
  return DataDB.salas_piso1.plantillas.every(p => Array.isArray(p.layout) && p.layout.length === 7
    && p.layout.every(r => r.length === 13 && [...r].every(c => LEG.has(c))));
})());
(() => {
  const BIOMAS = ['pendulos', 'archivo', 'invertida', 'truenos'];
  const propias = b => DataDB.salas_piso1.plantillas.filter(p => (p.pisos ?? []).includes(b));
  assert('D1: cada bioma tiene ≥4 plantillas propias', BIOMAS.every(b => propias(b).length >= 4));
  // pickTemplate (vía Room) respeta el bioma: una sala de Péndulos (piso 1) NUNCA usa una
  // plantilla exclusiva de otro bioma.
  const otras = new Set(['archivo', 'invertida', 'truenos'].flatMap(b => propias(b).map(p => p.id)));
  let ok = true, usadas = new Set();
  for (let i = 0; i < 40; i++) {
    const rm = new Room(0, i, 'camara', 1); // piso 1 = Péndulos
    const id = (rm.template || '').replace(' (espejo)', '');
    usadas.add(id);
    if (otras.has(id)) { ok = false; break; }
  }
  assert('D1: una sala de Péndulos no usa plantillas de otros biomas', ok);
})();

// Fase D — D3: escalonar debuts (pool de enemigos filtrado por rango de piso [min..max])
(() => {
  const tiene = (b, p, id) => poolBioma(b, p).some(d => d.id === id);
  // cascabel_laton debuta en piso 2 → fuera del pool en piso 1, dentro en piso 3
  assert('D3: enemigo de debut tardío fuera del pool en su piso previo',
    !tiene('pendulos', 1, 'cascabel_laton') && tiene('pendulos', 3, 'cascabel_laton'));
  assert('D3: enemigo básico (cera_andante) dentro del pool en piso 1', tiene('pendulos', 1, 'cera_andante'));
  // Ningún piso 1..12 se queda sin enemigos (biomaDe: 1-3 pend, 4-6 arch, 7-9 inv, 10-12 tru)
  const BIO = ['pendulos', 'pendulos', 'pendulos', 'archivo', 'archivo', 'archivo', 'invertida', 'invertida', 'invertida', 'truenos', 'truenos', 'truenos'];
  assert('D3: ningún piso queda con el pool vacío', BIO.every((b, i) => poolBioma(b, i + 1).length > 0));
})();

// Fase D — D4: jefe de raid reservado a fin de mundo (3/6/9/12); minijefe en intermedios
assert('D4: balance.minijefe define hp_mult/escolta', DataDB.balance.minijefe && DataDB.balance.minijefe.hp_mult > 1);
(() => {
  const rm = new Room(0, 0, 'jefe', 1); // piso 1 = intermedio (no múltiplo de 3)
  const c = { x: rm.bounds.x + rm.bounds.w / 2, y: rm.bounds.y + rm.bounds.h * 0.4 };
  const spawns = rm._spawnMinijefe(c, 1, 1);
  const champ = spawns.find(s => s.overrides?.minijefe);
  assert('D4: el minijefe es un campeón élite con nombre + escoltas',
    !!champ && !!champ.overrides.elite && /Campe/.test(champ.overrides.nombre) && spawns.length >= 2);
  // el campeón aguanta más que un enemigo normal del mismo id
  const normal = new Enemy(champ.id, 0, 0);
  const boss = new Enemy(champ.id, 0, 0, champ.overrides);
  assert('D4: el campeón tiene mucha más vida que el enemigo base', boss.health.max > normal.health.max * 2);
})();
(() => {
  // Integración: la sala de jefe prepara RAID en fin de mundo (piso 3) y MINIJEFE en intermedio (piso 1)
  const stub = { enemies: [] };
  const bossAt = piso => { const f = buildTower(piso, 4242); const b = [...f.rooms.values()].find(r => r.type === 'jefe'); b.enter(stub); return b; };
  const b3 = bossAt(3), b1 = bossAt(1);
  assert('D4: piso 3 (fin de mundo) prepara el jefe de RAID (jefe_ancla)',
    b3.pendingSpawns.some(s => s.overrides?.comportamiento === 'jefe_ancla'));
  assert('D4: piso 1 (intermedio) prepara MINIJEFE, no raid',
    b1.pendingSpawns.some(s => s.overrides?.minijefe) && !b1.pendingSpawns.some(s => s.overrides?.comportamiento === 'jefe_ancla'));
})();

// Fase D — D5: Cámara de Sincronía (bonus por PERFECTOS de Cadencia, no por tiempo)
assert('D5: balance.sincronia define objetivo/bonus', DataDB.balance.sincronia && DataDB.balance.sincronia.objetivo_base >= 1);
(() => {
  const rs = new Room(1, 1, 'sincronia', 3);
  assert('D5: la sala de sincronía es de combate con reto por perfectos',
    rs.cleared === false && rs.spawnPts.length > 0 && rs.reto?.modo === 'sincronia' && rs.reto.objetivo > 0);
  // enter() activa el reto y captura los perfectos iniciales (para medir el delta al limpiar)
  RunState.resetFloorStats(); RunState.floorStats.perfects = 5;
  rs.enter({ enemies: [] });
  assert('D5: enter() activa el reto de sincronía y fija perfectsInicio',
    rs.reto.activo === true && rs.reto.perfectsInicio === 5);
  // el reto de sincronía NO corre por tiempo (no tiene límite ni tick de reloj)
  rs.update(0.5, { enemies: [], tears: { spawn() {} }, bullets: { spawn() {} } });
  assert('D5: el reto de sincronía no corre por tiempo', rs.reto.t === undefined || rs.reto.limite === undefined);
})();

// Ampliación de OBJETOS + apariencia (cada reliquia con silueta distinta)
assert('roster de reliquias ampliado (≥50)', DataDB.items.items.length >= 50); // C1: ~50-60
assert('toda reliquia tiene icono_forma (silueta propia)', DataDB.items.items.every(i => typeof i.icono_forma === 'string'));
assert('C1: sinergias ampliadas (≥6)', (DataDB.items.sinergias?.length ?? 0) >= 6);
// C1 — payoff rítmico: las reliquias groove_buff SOLO rinden con la racha (groove) alta.
(() => {
  const saved = [...RunState.items]; RunState.items.length = 0;
  const pA = new Player(0, 0); const base = pA.stats.tear_damage;
  applyItem(DataDB.item('corazon_metronomo'), pA); // groove_buff dano +0.35
  assert('C1: groove_buff NO aplica sin la racha alta', Math.abs(pA.stats.tear_damage - base) < 1e-6);
  pA.grooveBuffed = true; pA.recomputeStats();
  RunState.items.length = 0;
  const pB = new Player(0, 0); pB.grooveBuffed = true; pB.recomputeStats(); // racha alta, sin reliquia
  assert('C1: groove_buff añade daño extra con la racha alta', pA.stats.tear_damage > pB.stats.tear_damage);
  RunState.items.length = 0; RunState.items.push(...saved);
})();
(() => {
  const pit = new Player(0, 0);
  const r0 = pit.stats.tear_range_px;
  applyItem(DataDB.item('cristal_enfoque'), pit);
  assert('reliquia nueva cristal_enfoque aumenta el alcance', pit.stats.tear_range_px > r0);
  const cv = document.createElement('canvas'), g2 = cv.getContext('2d');
  let ok = true; try { for (const it of DataDB.items.items) drawItemIcon(g2, it.icono_forma, it.icono_color, 8, 8, 5); drawItemIcon(g2, 'forma_inexistente', '#fff', 8, 8, 5); } catch { ok = false; }
  assert('drawItemIcon pinta todas las formas (y una desconocida) sin romper', ok);
})();

// Ampliación de ENEMIGOS y EVENTOS
assert('roster de enemigos ampliado (≥23)', DataDB.enemigos.enemigos.length >= 23);
assert('eventos ampliados (≥7)', DataDB.eventos.eventos.length >= 7);
(() => {
  const nuevos = ['cascabel_laton', 'esquirla_de_polvo', 'sebo_hirviente', 'centinela_de_polvo'];
  const comps = new Set(['blink', 'charger', 'chase', 'chase_explode', 'chase_heavy', 'cuckoo', 'flee_aura', 'healer', 'orbit_shoot', 'reviver', 'shielder', 'spiral_shooter', 'turret', 'wander_bounce']);
  let ok = true, enPool = true;
  for (const id of nuevos) {
    const def = DataDB.enemigo(id);
    if (!def || !comps.has(def.comportamiento) || !def.familia) ok = false;
    if (!Object.values(DataDB.enemigos.pools_spawn).some(pl => pl.includes(id))) enPool = false;
    try { new Enemy(id, 0, 0); } catch { ok = false; }
  }
  assert('los 4 enemigos nuevos: comportamiento válido, familia, e instancian', ok);
  assert('los 4 enemigos nuevos están en algún pool de bioma', enPool);
})();

// Fase C — C2 (pedestal elige 1 de 2-3) + C3 (conjuntos/set-bonus por etiqueta)
(() => {
  const saved = [...RunState.items]; RunState.items.length = 0; // pool limpio para rollItem
  const rt = new Room(1, 1, 'tesoro', 3);
  const peds = [rt.pedestal, rt.pedestal2, rt.pedestal3].filter(Boolean);
  assert('C2: el tesoro ofrece ≥2 reliquias a elegir', peds.length >= 2 && peds.every(pd => pd.itemId));
  RunState.items.length = 0; RunState.items.push(...saved);
})();
assert('C3: items.json define conjuntos (set-bonus por tag)', Array.isArray(DataDB.items.conjuntos) && DataDB.items.conjuntos.length >= 3);
(() => {
  const saved = [...RunState.items]; RunState.items.length = 0;
  const pc = new Player(0, 0);
  applyItem(DataDB.item('cera_caliente'), pc);   // lagrimas (no toca tear_rate)
  applyItem(DataDB.item('lagrimas_espejo'), pc); // lagrimas (no toca tear_rate)
  const r0 = pc.stats.tear_rate_per_s;
  applyItem(DataDB.item('tinta_viva'), pc);      // 3ª de lagrimas → activa "Torrente de Tinta"
  assert('C3: el conjunto se activa al reunir 3 de una etiqueta', pc.mods.conjuntos.includes('lagrimas:3'));
  assert('C3: el conjunto aplica su efecto (tear_rate ×1.2)', pc.stats.tear_rate_per_s > r0 * 1.15);
  RunState.items.length = 0; RunState.items.push(...saved);
})();

// Fase C — C4 (Heat / pactos: condiciones de dificultad OPT-IN, apilables, +Memoria por tramo)
assert('C4: pactos.json define pactos con efecto/nivel/memoria',
  Array.isArray(DataDB.pactos?.pactos) && DataDB.pactos.pactos.length >= 4 &&
  DataDB.pactos.pactos.every(p => p.id && p.efecto?.tipo && (p.max_nivel ?? 0) >= 1 && typeof p.memoria_por_nivel === 'number'));
(() => {
  const defs = [{ id: 'a', max_nivel: 3, memoria_por_nivel: 0.1, efecto: { tipo: 'hp_enemigo', por_nivel: 0.2 } }];
  assert('C4: calcHeat suma niveles activos', calcHeat({ a: 2, b: 1 }) === 3);
  assert('C4: calcMemoriaMult apila (+0.1×2 = 1.2)', Math.abs(calcMemoriaMult({ a: 2 }, defs) - 1.2) < 1e-9);

// Generación procedural: 60 pisos válidos (spec §5)
import('../js/rooms.js').then(async ({ buildTower }) => {
  const R = DataDB.balance.run;
  let ok = true, fallos = [];
  for (let i = 0; i < 60; i++) {
    const piso = 1 + (i % 12); // cubre los 12 pisos, incluida La Bóveda de Truenos (10-12)
    const f = buildTower(piso, i * 7717 + 13);
    const rooms = [...f.rooms.values()];
    const types = rooms.map(r => r.type);
    for (const need of ['jefe', 'tesoro', 'tienda', 'inicial']) {
      if (!types.includes(need)) { ok = false; fallos.push(i + ':sin_' + need); }
    }
    // Laberinto CONEXO: BFS desde 'inicial' por las puertas debe alcanzar TODAS las salas
    // (anti-softlock real; sustituye a la vieja comprobación de columna vertical).
    const startR = rooms.find(r => r.type === 'inicial');
    if (!startR || f.current !== startR) { ok = false; fallos.push(i + ':inicial'); }
    else {
      const DIRV = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] };
      const seen = new Set([startR.gx + ',' + startR.gy]), q = [startR];
      while (q.length) {
        const r = q.shift();
        for (const dir of ['n', 's', 'e', 'w']) {
          if (!r.doors[dir]) continue;
          const [dx, dy] = DIRV[dir], nk = (r.gx + dx) + ',' + (r.gy + dy);
          if (f.rooms.has(nk) && !seen.has(nk)) { seen.add(nk); q.push(f.rooms.get(nk)); }
        }
      }
      if (seen.size !== rooms.length) { ok = false; fallos.push(i + ':inconexo' + seen.size + '/' + rooms.length); }
      // El jefe debe ser alcanzable desde el inicio
      const boss = rooms.find(r => r.type === 'jefe');
      if (!boss || !seen.has(boss.gx + ',' + boss.gy)) { ok = false; fallos.push(i + ':jefe_inalcanzable'); }
    }
    // Puertas SIMÉTRICAS: si A tiene puerta hacia B, B tiene la puerta recíproca (mismo objeto)
    for (const r of rooms) {
      for (const [dir, opp, dx, dy] of [['n', 's', 0, -1], ['s', 'n', 0, 1], ['e', 'w', 1, 0], ['w', 'e', -1, 0]]) {
        if (!r.doors[dir]) continue;
        const nb = f.rooms.get((r.gx + dx) + ',' + (r.gy + dy));
        if (!nb || nb.doors[opp] !== r.doors[dir]) { ok = false; fallos.push(i + ':puerta_asim'); }
      }
    }
  }
  assert('60 torres LABERÍNTICAS: grafo conexo inicio→jefe, puertas simétricas, tesoro/tienda' + (fallos.length ? ' [' + fallos.slice(0, 3) + ']' : ''), ok);
  // Zona nueva — La Bóveda de Truenos (pisos 10-12) y su mecánica de descargas
  const f10 = buildTower(10, 999);
  const bioma10 = [...f10.rooms.values()][0].bioma;
  assert('piso 10 pertenece a La Bóveda de Truenos', bioma10?.id === 'truenos');
  assert('el bioma truenos define su mecánica de descargas', typeof bioma10?.truenos?.period_s === 'number');
  assert('la Torre llega a 12 pisos', DataDB.balance.run.floors_total === 12);
  const camaraTruenos = [...f10.rooms.values()].find(r => r.truenos);
  assert('las cámaras de truenos arman su estado de descargas', !!camaraTruenos);
  const h2 = document.createElement('h2');
  h2.className = failed ? 'fail' : 'pass';
  h2.textContent = failed ? `${failed} test(s) FALLARON` : 'TODOS LOS TESTS PASAN';
  out.appendChild(h2);
  document.title = failed ? 'FAIL' : 'PASS';
  console.log('SMOKE: ' + (failed ? failed + ' FAIL' : 'ALL PASS'));
});
