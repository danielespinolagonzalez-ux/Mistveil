<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mistveil — test de humo</title>
<style>
  body { background: #14121d; color: #cfc6e8; font: 14px/1.6 monospace; padding: 24px; }
  .pass { color: #7ec98f; } .fail { color: #e07a7a; }
</style>
</head>
<body>
<h1>test_smoke</h1>
<div id="out"></div>
<script type="module">
// Test de humo: DataDB valida, el player existe y se mueve, el pool de lágrimas funciona.
import { DataDB } from '../js/data_db.js';
import { Player, Enemy, TearPool, BulletPool } from '../js/entities.js';
import { computeQuality, Cadencia } from '../js/cadencia.js';
import { buildTestFloor, isDoorFront, TILE, RW, RH } from '../js/rooms.js';
import { applyItem, applyItemEffects } from '../js/items.js';
import { elementMult } from '../js/spells.js';
import { EventBus } from '../js/event_bus.js';
import { GameState, RunState } from '../js/state.js';
import { nodoDisponible, activarNodo, esferaBonos } from '../js/esfera.js';
import { syncFamiliares, updateFamiliares } from '../js/familiares.js';
import { spawnArt, updateArt, romano } from '../js/artes_fx.js';
import { selloDef, obtenerSello, rasgoCuraPorSp, finisherElemental } from '../js/sellos.js';

const out = document.getElementById('out');
let failed = 0;
function assert(name, cond) {
  const li = document.createElement('div');
  li.className = cond ? 'pass' : 'fail';
  li.textContent = (cond ? 'PASS  ' : 'FAIL  ') + name;
  out.appendChild(li);
  if (!cond) failed++;
}

// Corrige las rutas relativas de DataDB (tests/ está un nivel por debajo)
const origFetch = window.fetch;
window.fetch = (url, ...a) => origFetch(url.startsWith('data/') ? '../' + url : url, ...a);

const ok = await DataDB.load();
assert('DataDB carga sin errores', ok && DataDB.errors.length === 0);
assert('balance.player.move_speed existe y es número', typeof DataDB.balance?.player?.move_speed === 'number');
assert('elementos define color para neutro', typeof DataDB.elementos?.neutro?.color === 'string');
assert('enemigos incluye cera_andante', !!DataDB.enemigo('cera_andante'));
assert('textos_es tiene ui.muerte', DataDB.texto('ui.muerte') !== '[ui.muerte]');

// Player existe y responde a la física
const room = { x: 0, y: 0, w: 416, h: 224 };
const roomCtx = {
  bounds: room,
  playerSolids: () => [],
  clampPlayer: p => {
    p.x = Math.min(Math.max(p.x, room.x + p.r), room.x + room.w - p.r);
    p.y = Math.min(Math.max(p.y, room.y + p.r), room.y + room.h - p.r);
  }
};
const p = new Player(200, 100);
assert('Player se instancia con hp = max_hp', p.health.hp === DataDB.balance.player.max_hp);
const fakeInput = {
  moveVector: () => [1, 0],
  aimVector: () => ({ x: 1, y: 0, active: false }),
  shooting: () => false,
  justPressed: () => false
};
const world = { tears: new TearPool(), bullets: { spawn(){} } };
const x0 = p.x;
for (let i = 0; i < 30; i++) p.update(1 / 60, fakeInput, roomCtx, world);
assert('Player acelera hacia la derecha con input', p.x > x0 + 10);

// R-Assets — Pip poses: ventanas visuales de arte/parada que el motor decrementa
assert('Pip arranca sin ventana de pose arte/parada', p.castT === 0 && p.parryAnimT === 0);
p.castT = 0.3; p.parryAnimT = 0.3;
p.update(1 / 60, fakeInput, roomCtx, world);
assert('las ventanas de pose (arte/parada) caducan solas', p.castT < 0.3 && p.parryAnimT < 0.3);

// Pool de lágrimas: spawn, avance y expiración por alcance
const tp = new TearPool();
tp.spawn(50, 50, 200, 0, 100, 3.5);
assert('TearPool activa 1 lágrima', tp.count === 1);
for (let i = 0; i < 60; i++) tp.update(1 / 60, room);
assert('La lágrima expira al agotar su alcance', tp.count === 0);

// Enemigo data-driven
const e = new Enemy('cera_andante', 300, 100);
assert('Enemy toma hp del JSON', e.health.hp === DataDB.enemigo('cera_andante').hp);
const dmg = e.takeDamage(3.5, 290, 100);
assert('Daño redondeado (3.5 → 4)', dmg === 4);

// Cadencia: ventanas de timing (función pura)
assert('Cadencia: pulsar en el alineamiento = perfecta', computeQuality(700, 700, 120, 230, 40) === 'perfect');
assert('Cadencia: -80ms = buena', computeQuality(620, 700, 120, 230, 40) === 'good');
assert('Cadencia: coyote input (-135ms) = buena', computeQuality(565, 700, 120, 230, 40) === 'good');
assert('Cadencia: +130ms = fallo', computeQuality(830, 700, 120, 230, 40) === 'fail');
assert('Cadencia: tarde no tiene coyote', computeQuality(850, 700, 120, 230, 40) === 'fail');

// Piso de prueba: 6 salas conectadas y puertas compartidas
const floor = buildTestFloor();
assert('El piso tiene 6 salas', floor.rooms.size === 6);
assert('Hay sala del jefe', [...floor.rooms.values()].some(r => r.type === 'jefe'));
assert('Puertas compartidas entre salas', floor.at(0, 1).doors.e === floor.at(1, 1).doors.w);
assert('El vecino al este de la inicial existe', floor.neighbor(floor.at(0, 1), 'e') === floor.at(1, 1));

// Validador de plantillas: nada sólido frente a las puertas
let doorsClear = true;
for (const room of floor.rooms.values()) {
  for (let ty = 0; ty < RH; ty++) for (let tx = 0; tx < RW; tx++) {
    if (!isDoorFront(tx, ty)) continue;
    const cx = room.bounds.x + tx * TILE + TILE / 2, cy = room.bounds.y + ty * TILE + TILE / 2;
    for (const s of room.groundSolids()) {
      if (cx > s.x && cx < s.x + s.w && cy > s.y && cy < s.y + s.h) doorsClear = false;
    }
  }
}
assert('Ninguna plantilla bloquea una puerta', doorsClear);

// Motor de items: stats y efectos
const p2 = new Player(100, 100);
const speed0 = p2.stats.move_speed;
applyItem(DataDB.item('segundero_suelto'), p2);
assert('segundero_suelto: move_speed ×1.15', Math.abs(p2.stats.move_speed - speed0 * 1.15) < 0.01);
applyItem(DataDB.item('cuerda_extra'), p2);
assert('cuerda_extra: +1 corazón máximo (+2 puntos)', p2.health.max === DataDB.balance.player.max_hp + 2);
applyItem(DataDB.item('metronomo_bolsillo'), p2);
assert('metrónomo: ventanas ×1.4', Math.abs(p2.mods.cadencia.window_scale - 1.4) < 0.01);

// Elementos: oposiciones
assert('fuego → agua = ×1.5', elementMult('agua', 'fuego') === 1.5);
assert('fuego → fuego = ×0.5', elementMult('fuego', 'fuego') === 0.5);
assert('neutro → fuego = ×1.0', elementMult('neutro', 'fuego') === 1.0);
assert('hechizos.json cargado', !!DataDB.hechizo('estallido_de_tinta'));
assert('compases.json cargado (3 compases)', DataDB.compases?.compases?.length === 3);
assert('santuario.json: 8 nodos con coste en balance.arbol',
  DataDB.santuario?.nodos?.length === 8 &&
  DataDB.santuario.nodos.every(n => typeof DataDB.balance.arbol[n.id] === 'number'));
assert('mejoras_piso en balance (≥6)', (DataDB.balance.mejoras_piso?.length ?? 0) >= 6);

// R0.3 — EventBus: off y once
let nOn = 0;
const fnOn = () => nOn++;
EventBus.on('prueba_emitida', fnOn);
EventBus.emit('prueba_emitida');
EventBus.off('prueba_emitida', fnOn);
EventBus.emit('prueba_emitida');
assert('EventBus.off desuscribe', nOn === 1);
let nOnce = 0;
EventBus.once('prueba_emitida', () => nOnce++);
EventBus.emit('prueba_emitida');
EventBus.emit('prueba_emitida');
assert('EventBus.once dispara una sola vez', nOnce === 1);

// R0.1 — orbit_shoot en tiempo real: la polilla se mueve Y dispara
const moth = new Enemy('polilla_del_polvo', 340, 96, {});
const fired = [];
const mothWorld = { tears: new TearPool(), bullets: { spawn(b) { fired.push(b); } }, corpses: [] };
const mx0 = moth.x, my0 = moth.y;
for (let i = 0; i < 260; i++) moth.update(1 / 60, p, roomCtx, mothWorld);
assert('orbit_shoot: la polilla se mueve (orbita)', Math.hypot(moth.x - mx0, moth.y - my0) > 20 || Math.hypot(moth.vx, moth.vy) > 1);
assert('orbit_shoot: la polilla dispara con su cadencia', fired.length >= 1);

// Contenido nuevo — enemigos: existen, instancian y sus comportamientos corren
for (const id of ['badajo_errante', 'girandula', 'remora_de_tinta', 'peon_de_sebo', 'cimbalo'])
  assert('enemigo nuevo existe: ' + id, !!DataDB.enemigo(id));
const ep = new Player(300, 200);
const ctxE = { bounds: room, groundSolids: () => [] }; // enemigos no voladores tocan groundSolids
const badWorld = { tears: new TearPool(), bullets: { spawn() {} }, corpses: [] };
const bad = new Enemy('badajo_errante', 130, 200, {}); // a 170px → dentro del rango de carga
let vioWindup = false, vioStrike = false;
for (let i = 0; i < 220; i++) { bad.update(1 / 60, ep, ctxE, badWorld); if (bad.atk.state === 'windup') vioWindup = true; if (bad.atk.state === 'strike') vioStrike = true; }
assert('charger: telegrafía (windup) y embiste (strike)', vioWindup && vioStrike);
const girFired = [];
const girWorld = { tears: new TearPool(), bullets: { spawn(b) { girFired.push(b); } }, corpses: [] };
const gir = new Enemy('girandula', 300, 200, {});
for (let i = 0; i < 140; i++) gir.update(1 / 60, ep, ctxE, girWorld);
assert('spiral_shooter: dispara balas en espiral', girFired.length >= 6);

// Mecánicas variadas nuevas (blink / shielder / divide / healer)
for (const id of ['saltahoras', 'broquel', 'cumulo_de_sebo', 'restaurador'])
  assert('mecánica nueva existe: ' + id, !!DataDB.enemigo(id));
const ctxM = { bounds: room, groundSolids: () => [] };
const emptyW = { tears: new TearPool(), bullets: { spawn() {} }, corpses: [], enemies: [] };
const blk = new Enemy('saltahoras', 40, 40, {});
for (let i = 0; i < 150; i++) blk.update(1 / 60, ep, ctxM, emptyW);
assert('blink: se teletransporta (deja su origen)', Math.hypot(blk.x - 40, blk.y - 40) > 60);
const shd = new Enemy('broquel', ep.x - 40, ep.y, { hp: 999 });
shd.update(1 / 60, ep, ctxM, emptyW); // fija _faceAng hacia el jugador (a la derecha)
const dFront = shd.takeDamage(10, ep.x, ep.y, 0);          // golpe frontal (arco del escudo)
const dBack = shd.takeDamage(10, shd.x - 40, shd.y, 0);    // golpe por la espalda
assert('shielder: el escudo frontal absorbe (frente << espalda)', dFront < dBack);
assert('divide: la cría del Cúmulo es un enemigo válido', !!DataDB.enemigo(DataDB.enemigo('cumulo_de_sebo').divide.hijo));
const heal = new Enemy('restaurador', ep.x, ep.y + 40, {});
const ally = new Enemy('cera_andante', ep.x, ep.y + 90, {});
ally.health.hp = 1;
const healW = { tears: new TearPool(), bullets: { spawn() {} }, corpses: [], enemies: [heal, ally] };
for (let i = 0; i < 150; i++) heal.update(1 / 60, ep, ctxM, healW);
assert('healer: cura a un aliado herido cercano', ally.health.hp > 1);

// R0.2 — escalado de daño por piso (danoMult en overrides)
const eScaled = new Enemy('tejedor_horas', 0, 0, { danoMult: 1.5 });
assert('danoMult escala el proyectil (1 → 2)', eScaled.def.proyectil.dano === 2);
const cScaled = new Enemy('cera_andante', 0, 0, { danoMult: 1.5 });
assert('danoMult escala el contacto (1 → 2)', cScaled.def.dano_contacto === 2);
const sinEscala = new Enemy('cera_andante', 0, 0, {});
assert('sin danoMult el daño no cambia', sinEscala.def.dano_contacto === DataDB.enemigo('cera_andante').dano_contacto);

// R0.6 — Esfera del Reloj: adyacencia y agregado de bonos
const esferaPrev = [...GameState.esfera];
const engrPrev = GameState.engranajes;
GameState.esfera.length = 0; GameState.esfera.push('eje');
GameState.engranajes = 9;
assert('esfera: nodo pegado al eje disponible', nodoDisponible('i0') === true);
assert('esfera: anillo exterior bloqueado sin sello', nodoDisponible('o0') === false);
assert('esfera: activar i0 gasta y abre el sello XII', activarNodo('i0') === true && nodoDisponible('s0') === true);
assert('esfera: bonos agregados sin error', typeof esferaBonos().window === 'number');
GameState.esfera.length = 0; GameState.esfera.push(...esferaPrev);
GameState.engranajes = engrPrev;

// R1 — Reliquias completas: los 6 efectos antes "pendientes" ya se interpretan
const p3 = new Player(100, 100);
applyItem(DataDB.item('tinta_viva'), p3);
assert('tinta_viva: registra el familiar gota_tinta', p3.mods.familiares.includes('gota_tinta'));
applyItem(DataDB.item('polilla_lunar'), p3);
assert('polilla_lunar: registra el orbital', p3.mods.familiares.includes('orbital_polilla'));
applyItem(DataDB.item('arena_del_tiempo'), p3);
assert('arena_del_tiempo: objeto activo cargado al cogerlo',
  p3.mods.activo?.accion === 'global_slowmo' && RunState.activoSalas === p3.mods.activo.cooldown_salas);
applyItem(DataDB.item('ojo_de_vidrio'), p3);
assert('ojo_de_vidrio: revela el mapa', p3.mods.revealMap === true);
applyItem(DataDB.item('aceite_negro'), p3);
assert('aceite_negro: rastro del dash configurado', p3.mods.dashTrail?.dano_por_s === 2);
applyItem(DataDB.item('paginas_perdidas'), p3);
assert('paginas_perdidas: doble elección en el tesoro', p3.mods.extraChoice === 2);

// R1.6 — NINGÚN item de items.json deja efectos sin interpretar
const p4 = new Player(100, 100);
for (const it of DataDB.items.items) applyItemEffects(it, p4);
assert('todos los items interpretados (pendientes vacío)' +
  (p4.mods.pendientes.length ? ' [' + p4.mods.pendientes.join(', ') + ']' : ''),
  p4.mods.pendientes.length === 0);

// R1.1 — Familiares en movimiento: la gota dispara al enemigo cercano
const dueno = new Player(100, 100);
dueno.mods.familiares.push('gota_tinta');
const fWorld = { tears: new TearPool(), bullets: new BulletPool(), familiares: [] };
syncFamiliares(fWorld, dueno);
assert('syncFamiliares crea la gota', fWorld.familiares.length === 1 && fWorld.familiares[0].id === 'gota_tinta');
const cebo = new Enemy('cera_andante', 160, 100);
updateFamiliares(1 / 60, fWorld, dueno, [cebo]);
assert('la gota dispara al enemigo a rango', fWorld.tears.count === 1);
dueno.mods.familiares.length = 0;
syncFamiliares(fWorld, dueno);
assert('sin el item, el familiar se despide', fWorld.familiares.length === 0);

// R2 — Sellos elementales (botín de jefes de bioma)
assert('sellos: Ascuas y Marea activos con efectos máquina',
  selloDef('sello_ascuas')?.estado === 'activo' && selloDef('sello_ascuas').rasgo_fx?.tipo === 'dash_burn'
  && selloDef('sello_marea')?.estado === 'activo' && selloDef('sello_marea').finisher_fx?.elemento === 'agua');
assert('sellos: los jefes de bioma tienen su sello asignado',
  DataDB.biomas.jefes_bioma.pendulos.sello === 'sello_ascuas'
  && DataDB.biomas.jefes_bioma.archivo.sello === 'sello_marea');
const selloPrevEq = GameState.selloEquipado, selloPrevCol = [...GameState.sellosObtenidos];
GameState.sellosObtenidos.length = 0; GameState.selloEquipado = null; RunState.selloSpAcum = 0;
obtenerSello('sello_ascuas');
assert('sellos: obtener equipa y añade a la colección',
  GameState.selloEquipado === 'sello_ascuas' && GameState.sellosObtenidos.includes('sello_ascuas'));
assert('sellos: el finisher de Ascuas es onda de fuego', finisherElemental()?.elemento === 'fuego');
obtenerSello('sello_marea');
const pM = new Player(0, 0);
pM.health.hp = 2;
rasgoCuraPorSp(12, pM);
const sinCura = pM.health.hp;
rasgoCuraPorSp(12, pM);
assert('marea: cura 1 al acumular 20 SP de perfectos', sinCura === 2 && pM.health.hp === 3);
GameState.selloEquipado = selloPrevEq;
GameState.sellosObtenidos.length = 0; GameState.sellosObtenidos.push(...selloPrevCol);

// Mejora — Esquiva en Cadencia: el dash NO rompe el combo, congela el anillo
const cadD = new Cadencia(); cadD.getSolids = () => [];
const cadP = new Player(100, 100);
const cadE = new Enemy('cera_andante', 128, 100);
let pressed = {};
const cadIn = { justPressed: a => !!pressed[a], consume: a => { pressed[a] = false; } };
pressed = { melee: true };
cadD.update(1 / 60, cadIn, cadP, [cadE]);
assert('Cadencia inicia al pulsar melee cerca', cadD.active === true);
pressed = {};
cadD.update(0.1, cadIn, cadP, [cadE]);
const tAntes = cadD.t;
assert('el anillo avanza sin dash', tAntes > 0);
cadP.dashT = 0.12;
cadD.update(0.05, cadIn, cadP, [cadE]);
assert('el dash NO rompe el combo (esquiva en Cadencia)', cadD.active === true);
assert('el anillo se congela mientras esquivas', Math.abs(cadD.t - tAntes) < 0.001);

// Mejora — Encadenar: si el objetivo cae a mitad de combo, salta al siguiente
const cadC = new Cadencia(); cadC.getSolids = () => [];
const cadCP = new Player(100, 100);
const objA = new Enemy('cera_andante', 120, 100); objA.health.hp = 1;
const objB = new Enemy('cera_andante', 140, 100);
cadC._start(cadCP, objA);
cadC._landHit('perfect', cadCP, [objA, objB]);
assert('el combo encadena al siguiente enemigo al matar', cadC.active === true && cadC.target === objB);

// Mejora — Refund de dash: un golpe perfecto recorta el enfriamiento del dash
const cadR = new Cadencia(); cadR.getSolids = () => [];
const cadRP = new Player(100, 100);
const objR = new Enemy('cera_andante', 120, 100);
cadRP.dashCd = 0.5;
cadR._start(cadRP, objR);
cadR._landHit('perfect', cadRP, [objR]);
assert('un perfecto recorta el cooldown del dash',
  cadRP.dashCd < 0.5 && Math.abs(cadRP.dashCd - (0.5 - DataDB.balance.cadencia.perfect_dash_refund_s)) < 0.001);

// Balance — primeros pisos suaves: presupuesto de sala crece con el piso pero
// arranca bajo (intención "que cueste menos progresar al principio").
{
  const R = DataDB.balance.run;
  const budget = piso => R.dificultad_sala_base + (piso - 1) * (R.dificultad_por_piso ?? 2);
  assert('piso 1 tiene el presupuesto de enemigos más bajo', budget(1) < budget(3));
  assert('piso 1 arranca gentil (presupuesto ≤ 5)', budget(1) <= 5);
  assert('la vida enemiga escala más suave al principio', R.escalado_hp_por_piso <= 0.32);
  assert('el primer nivel de la Esfera llega antes (≤ 70 XP)', DataDB.balance.xp.nivel_base <= 70);
}

// G4 — i-frames en el lunge: conectar un golpe hace a Pip brevemente intocable
const cadI = new Cadencia(); cadI.getSolids = () => [];
const cadIP = new Player(100, 100);
const objI = new Enemy('cera_andante', 120, 100);
cadI._start(cadIP, objI);
cadIP.comboIframeT = 0;
cadI._landHit('good', cadIP, [objI]);
assert('golpe bueno concede i-frames de combo', cadIP.comboIframeT > 0 && cadIP.invulnerable === true);
const iGood = cadIP.comboIframeT;
cadIP.comboIframeT = 0;
cadI._start(cadIP, objI);
cadI._landHit('perfect', cadIP, [objI]);
assert('el perfecto da MÁS i-frames que el bueno', cadIP.comboIframeT > iGood);
cadIP.comboIframeT = 0;
cadI._start(cadIP, objI);
cadI._landHit('fail', cadIP, [objI]);
assert('fallar NO da i-frames (sin refugio)', cadIP.comboIframeT === 0);

// G7a — dash-retarget: elige al enemigo en la dirección del dash
const cadN = new Cadencia(); cadN.getSolids = () => [];
const npl = new Player(100, 100);
const eDer = new Enemy('cera_andante', 170, 100);
const eIzq = new Enemy('cera_andante', 30, 100);
assert('dash-retarget apunta al enemigo hacia donde dasheas',
  cadN._nearestInDir(npl, [eDer, eIzq], [1, 0], 200) === eDer);
assert('dash-retarget ignora al que está a tu espalda',
  cadN._nearestInDir(npl, [eIzq], [1, 0], 200) === null);

// G7c — Groove/racha: sube encadenando, buff al umbral, se pierde al recibir daño
const gp = new Player(0, 0);
const meleeBase = gp.stats.melee_damage, speedBase = gp.stats.move_speed;
gp.addGroove(DataDB.balance.groove.umbral_buff);
assert('groove: cruzar el umbral enciende el buff', gp.grooveBuffed === true);
assert('groove: el buff sube daño y velocidad',
  gp.stats.melee_damage > meleeBase && gp.stats.move_speed > speedBase);
gp.hurt(1, 100, 100);
assert('groove: recibir daño rompe la racha (buff off)',
  gp.grooveBuffed === false && gp.groove < DataDB.balance.groove.umbral_buff);

// G5 / G7b — parámetros presentes (comportamiento se prueba en juego)
assert('G5: parámetros de bullet-time en balance',
  typeof DataDB.balance.game_feel.nearmiss_radius_px === 'number' && DataDB.balance.game_feel.nearmiss_factor < 1);
assert('G7b: flag shoot_during_combo activo', DataDB.balance.cadencia.shoot_during_combo === true);

// A4 — Firmas visuales de habilidad: spawn, caducidad y numeral romano
const artFx = [];
spawnArt(artFx, 'corona_tinta', 0, 0, { tmax: 0.1 });
spawnArt(artFx, 'campana_cristal', 0, 0, { tmax: 0.1 });
assert('artes_fx: spawnArt añade efectos', artFx.length === 2);
updateArt(artFx, 0.2);
assert('artes_fx: los efectos caducan por tiempo', artFx.length === 0);
assert('artes_fx: numeral romano del combo (3 → III)', romano(3) === 'III' && romano(1) === 'I');

// Generación procedural: 60 pisos válidos (spec §5)
import('../js/rooms.js').then(async ({ buildTower }) => {
  const R = DataDB.balance.run;
  let ok = true, fallos = [];
  for (let i = 0; i < 60; i++) {
    const piso = 1 + (i % 12); // cubre los 12 pisos, incluida La Bóveda de Truenos (10-12)
    const f = buildTower(piso, i * 7717 + 13);
    const rooms = [...f.rooms.values()];
    const types = rooms.map(r => r.type);
    for (const need of ['jefe', 'tesoro', 'tienda', 'inicial']) {
      if (!types.includes(need)) { ok = false; fallos.push(i + ':sin_' + need); }
    }
    // Cadena vertical conexa: cada segmento de la columna comparte puerta con el siguiente
    const col = rooms.filter(r => r.gx === 1).sort((a, b) => a.gy - b.gy);
    if (col[0].type !== 'inicial' || col[col.length - 1].type !== 'jefe') { ok = false; fallos.push(i + ':orden'); }
    for (let j = 0; j < col.length - 1; j++) {
      if (!col[j].doors.s || col[j].doors.s !== col[j + 1].doors.n) { ok = false; fallos.push(i + ':cadena' + j); }
    }
    // Las alcobas cuelgan de un segmento de la columna
    for (const r of rooms) {
      if (r.gx !== 1 && !(r.doors.e || r.doors.w)) { ok = false; fallos.push(i + ':alcoba'); }
    }
  }
  assert('60 torres generadas: inicial→jefe conexo, tesoro/tienda presentes' + (fallos.length ? ' [' + fallos.slice(0, 3) + ']' : ''), ok);
  // Zona nueva — La Bóveda de Truenos (pisos 10-12) y su mecánica de descargas
  const f10 = buildTower(10, 999);
  const bioma10 = [...f10.rooms.values()][0].bioma;
  assert('piso 10 pertenece a La Bóveda de Truenos', bioma10?.id === 'truenos');
  assert('el bioma truenos define su mecánica de descargas', typeof bioma10?.truenos?.period_s === 'number');
  assert('la Torre llega a 12 pisos', DataDB.balance.run.floors_total === 12);
  const camaraTruenos = [...f10.rooms.values()].find(r => r.truenos);
  assert('las cámaras de truenos arman su estado de descargas', !!camaraTruenos);
  const h2 = document.createElement('h2');
  h2.className = failed ? 'fail' : 'pass';
  h2.textContent = failed ? `${failed} test(s) FALLARON` : 'TODOS LOS TESTS PASAN';
  out.appendChild(h2);
  document.title = failed ? 'FAIL' : 'PASS';
  console.log('SMOKE: ' + (failed ? failed + ' FAIL' : 'ALL PASS'));
});
