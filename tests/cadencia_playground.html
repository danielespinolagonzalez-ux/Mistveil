<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mistveil — Cadencia playground</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #0a0812; color: #cfc6e8; font: 15px VT323, monospace; display: flex; height: 100vh; overflow: hidden; }
  #left { flex: 1; display: grid; place-items: center; }
  canvas { image-rendering: pixelated; background: #141120; cursor: crosshair; }
  #panel { width: 260px; background: #14111f; border-left: 2px solid #2b2440; padding: 14px; overflow-y: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #e9e2f5; }
  .sub { color: #6c6193; margin-bottom: 12px; }
  label { display: block; margin-top: 10px; color: #8d82ad; }
  input[type=range] { width: 100%; }
  .val { color: #ffd54f; float: right; }
  #hist { margin-top: 14px; letter-spacing: 2px; font-size: 20px; min-height: 24px; }
  .stat { display: flex; justify-content: space-between; margin-top: 4px; }
  .stat b { color: #e9e2f5; }
  button { background: #2b2440; color: #cfc6e8; border: 1px solid #4c4070; font: 14px VT323, monospace; padding: 4px 10px; margin-top: 12px; cursor: pointer; }
  button:hover { background: #3d3358; }
  .hint { color: #55496e; margin-top: 12px; line-height: 1.4; }
</style>
</head>
<body>
<div id="left"><canvas id="game" width="640" height="360"></canvas></div>
<div id="panel">
  <h1>Cadencia</h1>
  <div class="sub">playground de tuning · F5 recarga JSON</div>
  <div id="sliders"></div>
  <label>counter_chance del dummy <span class="val" id="ccv">0.45</span>
    <input type="range" id="cc" min="0" max="1" step="0.05" value="0.45">
  </label>
  <div id="hist"></div>
  <div class="stat"><span>Perfectas</span><b id="sP">0</b></div>
  <div class="stat"><span>Buenas</span><b id="sB">0</b></div>
  <div class="stat"><span>Fallos</span><b id="sF">0</b></div>
  <div class="stat"><span>Parries</span><b id="sPa">0</b></div>
  <div class="stat"><span>Counters encajados</span><b id="sCh">0</b></div>
  <div class="stat"><span>SP</span><b id="sSP">0</b></div>
  <button id="reset">Reiniciar stats</button>
  <div class="hint">Espacio: melé / encadenar<br>E: parada (anillo rojo)<br>Shift: dash (cancela combo)<br>El dummy se cura solo.</div>
</div>
<script type="module">
// Playground de la Cadencia: un dummy inmortal para ajustar ventanas y game feel.
const origFetch = window.fetch;
window.fetch = (url, ...a) => origFetch(url.startsWith('data/') ? '../' + url : url, ...a);

const { DataDB } = await import('../js/data_db.js');
const { EventBus } = await import('../js/event_bus.js');
const { Input } = await import('../js/input.js');
const { RunState, AudioManager } = await import('../js/state.js');
const { Player, Enemy, TearPool, BulletPool, circleHit } = await import('../js/entities.js');
const { Cadencia } = await import('../js/cadencia.js');
const { FX } = await import('../js/fx.js');

await DataDB.load();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VW = 640, VH = 360;
const bounds = { x: 40, y: 50, w: VW - 80, h: VH - 100 };

const player = new Player(bounds.x + 120, bounds.y + bounds.h / 2);
const dummy = new Enemy('campanero', bounds.x + bounds.w - 160, bounds.y + bounds.h / 2, {
  nombre: 'Dummy', velocidad: 0, dano_contacto: 0, hp: 100000, counter_chance: 0.45, r: 14
});
const world = { tears: new TearPool(), bullets: new BulletPool(), enemies: [dummy] };
const cad = new Cadencia();
const popups = [];

const stats = { P: 0, B: 0, F: 0, Pa: 0, Ch: 0, hist: [] };
const $ = id => document.getElementById(id);

// Sliders que escriben en DataDB.balance.cadencia EN CALIENTE
const SLIDERS = [
  ['window_perfect_ms', 40, 300, 5],
  ['window_good_ms', 80, 500, 5],
  ['ring_contract_ms', 300, 1400, 25],
  ['counter_window_ms', 100, 700, 10]
];
const sliderBox = $('sliders');
for (const [key, min, max, step] of SLIDERS) {
  const label = document.createElement('label');
  label.innerHTML = `${key} <span class="val" id="v_${key}"></span>`;
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step;
  inp.value = DataDB.balance.cadencia[key];
  inp.oninput = () => {
    DataDB.balance.cadencia[key] = Number(inp.value);
    $('v_' + key).textContent = inp.value;
  };
  $('v_' + key) ?? label.appendChild(inp);
  label.appendChild(inp);
  sliderBox.appendChild(label);
  queueMicrotask(() => $('v_' + key).textContent = inp.value);
}
$('cc').oninput = e => { dummy.def.counter_chance = Number(e.target.value); $('ccv').textContent = e.target.value; };
$('reset').onclick = () => { Object.assign(stats, { P: 0, B: 0, F: 0, Pa: 0, Ch: 0, hist: [] }); RunState.sp = 0; refresh(); };

function refresh() {
  $('sP').textContent = stats.P; $('sB').textContent = stats.B; $('sF').textContent = stats.F;
  $('sPa').textContent = stats.Pa; $('sCh').textContent = stats.Ch;
  $('sSP').textContent = RunState.sp;
  $('hist').innerHTML = stats.hist.slice(-14).map(q =>
    q === 'P' ? '<span style="color:#ffd54f">●</span>' :
    q === 'B' ? '<span style="color:#e9e2f5">●</span>' :
    q === 'p' ? '<span style="color:#7ee8e0">◆</span>' :
    q === 'c' ? '<span style="color:#ff3b30">✕</span>' :
    '<span style="color:#55496e">●</span>').join(' ');
}

EventBus.on('cadencia_hit', ({ x, y, quality, dmg, finisher }) => {
  const map = { perfect: ['¡Perfecta!', '#ffd54f', 'P'], good: ['Buena', '#e9e2f5', 'B'], fail: ['Fallo', '#8d82ad', 'F'] };
  const [txt, col, key] = map[quality];
  stats[key]++; stats.hist.push(key);
  popups.push({ x, y: y - 24, t: 0.8, text: txt + (dmg ? ' ' + dmg : ''), color: col, size: quality === 'perfect' ? 22 : 18 });
  FX.burst(x, y, { n: 8, color: col, speed: 90, life: 0.4, size: 2, glow: quality === 'perfect' });
  if (finisher) popups.push({ x, y: y - 44, t: 0.9, text: '¡Remate!', color: '#ff9c3a', size: 24 });
  refresh();
});
EventBus.on('cadencia_parried', () => { stats.Pa++; stats.hist.push('p'); refresh(); });
EventBus.on('cadencia_counter_hit', () => { stats.Ch++; stats.hist.push('c'); refresh(); });
EventBus.on('sp_changed', refresh);

Input.init(canvas, (cx, cy) => {
  const r = canvas.getBoundingClientRect();
  return [cx * VW / r.width, cy * VH / r.height];
});

const roomCtx = {
  bounds,
  playerSolids: () => [],
  groundSolids: () => [],
  clampPlayer: p => {
    p.x = Math.min(Math.max(p.x, bounds.x + p.r), bounds.x + bounds.w - p.r);
    p.y = Math.min(Math.max(p.y, bounds.y + p.r), bounds.y + bounds.h - p.r);
  }
};

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20);
  last = now;
  const t = now / 1000;

  if (Input.f5Pressed()) DataDB.reload();
  Input.pollGamepad();

  player.update(dt, Input, roomCtx, world);
  world.tears.update(dt, bounds);
  dummy.health.update(dt);
  if (dummy.flash > 0) dummy.flash -= dt;
  dummy.health.hp = dummy.health.max; // inmortal
  cad.update(dt, Input, player, [dummy]);

  world.tears.forEach(tr => {
    if (circleHit(tr, dummy)) {
      const dmg = dummy.takeDamage(tr.damage, tr.x, tr.y);
      popups.push({ x: dummy.x, y: dummy.y - 20, t: 0.5, text: String(dmg), color: '#f4f0e6', size: 16 });
      tr.active = false;
    }
  });
  dummy.kbx *= Math.pow(0.0001, dt); dummy.kby *= Math.pow(0.0001, dt);

  for (const p of popups) { p.t -= dt; p.y -= 30 * dt; }
  while (popups.length && popups[0].t <= 0) popups.shift();
  FX.update(dt);

  // ---- render ----
  ctx.fillStyle = '#141120'; ctx.fillRect(0, 0, VW, VH);
  ctx.strokeStyle = '#2b2440'; ctx.lineWidth = 2;
  ctx.strokeRect(bounds.x, bounds.y, bounds.w, bounds.h);
  for (let x = bounds.x; x < bounds.x + bounds.w; x += 32) {
    for (let y = bounds.y; y < bounds.y + bounds.h; y += 32) {
      ctx.fillStyle = ((x + y) / 32) % 2 ? '#1d1930' : '#211c36';
      ctx.fillRect(x, y, 32, 32);
    }
  }

  // dummy (campana simplificada)
  const dx = Math.round(dummy.x + dummy.kbx * 0.02), dy = Math.round(dummy.y);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(dx, dy + 16, 12, 4, 0, 0, 7); ctx.fill();
  ctx.fillStyle = dummy.flash > 0 ? '#fff' : '#b08d57';
  ctx.beginPath();
  ctx.moveTo(dx - 12, dy + 10);
  ctx.quadraticCurveTo(dx - 12, dy - 12, dx, dy - 15);
  ctx.quadraticCurveTo(dx + 12, dy - 12, dx + 12, dy + 10);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = dummy.flash > 0 ? '#fff' : '#6d5636';
  ctx.fillRect(dx - 14, dy + 9, 28, 5);
  ctx.fillStyle = dummy.countering ? '#ff3b30' : '#2b2214';
  ctx.fillRect(dx - 5, dy - 6, 10, 3);
  if (dummy.countering) {
    ctx.strokeStyle = 'rgba(255,60,48,0.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(dx, dy, 18 + Math.sin(t * 20) * 2, 0, 7); ctx.stroke();
  }

  // player (simplificado)
  const pxx = Math.round(player.x), pyy = Math.round(player.y);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(pxx, pyy + 10, 7, 3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = player.dashT > 0 ? '#e8ecff' : '#4a4577';
  ctx.fillRect(pxx - 6, pyy - 4, 12, 13);
  ctx.fillStyle = '#ece6d8'; ctx.fillRect(pxx - 4, pyy - 10, 8, 7);
  ctx.fillStyle = '#ffb547'; ctx.fillRect(pxx - 2 + Math.round(player.aim.x * 2), pyy - 8, 4, 4);

  // lágrimas
  world.tears.forEach(tr => {
    ctx.fillStyle = '#a9c0ff';
    ctx.beginPath(); ctx.arc(Math.round(tr.x), Math.round(tr.y), 3.5, 0, 7); ctx.fill();
  });

  FX.draw(ctx);
  cad.draw(ctx);

  // barra SP
  const k = RunState.sp / DataDB.balance.ignicion.sp_max;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(bounds.x, 20, 160, 8);
  ctx.fillStyle = k >= 1 ? '#ffe28a' : '#b08d57';
  ctx.fillRect(bounds.x, 20, 160 * k, 8);
  ctx.font = '16px VT323, monospace'; ctx.fillStyle = '#8d82ad'; ctx.textAlign = 'left';
  ctx.fillText('SP', bounds.x + 166, 28);

  for (const p of popups) {
    ctx.font = (p.size ?? 18) + 'px VT323, monospace';
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, p.t * 2.5);
    ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 3;
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }

  Input.endFrame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
